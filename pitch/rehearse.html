<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ซ้อมพูด 5 นาที</title>
<style>
@font-face{font-family:"Outfit";src:url("fonts/outfit-latin.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Plex Thai";src:url("fonts/plex-thai-thai-400.woff2") format("woff2");font-weight:400;unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Plex Thai";src:url("fonts/plex-thai-thai-600.woff2") format("woff2");font-weight:600;unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Plex Thai";src:url("fonts/plex-thai-thai-700.woff2") format("woff2");font-weight:700;unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"Plex Thai";src:url("fonts/plex-thai-latin-400.woff2") format("woff2");font-weight:400;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Thai";src:url("fonts/plex-thai-latin-600.woff2") format("woff2");font-weight:600;unicode-range:U+0000-00FF,U+2000-206F}
:root{--ink:#1f2937;--head:#0f4c5c;--mute:#6b7280;--line:#d1d5db;--soft:#f3f6f8;--teal:#0f8a74;--teal-bg:#e3f5f0;--gold:#d99a12;--gold-bg:#fdf3dc;--warn:#b45309;--over:#b91c1c;--over-bg:#fde8e8}
*{box-sizing:border-box}
html,body{margin:0;background:#eef1f4;color:var(--ink);font-family:"Plex Thai","Outfit",sans-serif}
.num{font-family:"Outfit","Plex Thai",sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;color:var(--head);font-weight:700}
.clock{display:flex;align-items:baseline;gap:8px}
.clock .big{font:700 34px "Outfit",sans-serif;color:var(--head)}
.clock .of{font-size:15px;color:var(--mute)}
.pace{font-size:15px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--soft);color:var(--mute)}
.pace.ahead{background:var(--teal-bg);color:var(--teal)}.pace.behind{background:var(--over-bg);color:var(--over)}
.btns{margin-left:auto;display:flex;gap:8px}
button{font:600 15px "Plex Thai",sans-serif;border:1px solid var(--line);background:#fff;color:var(--head);border-radius:8px;padding:7px 14px;cursor:pointer}
button.go{background:var(--teal);border-color:var(--teal);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding:16px 18px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.under{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:14px;line-height:1.45;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.chip.cue{background:var(--soft)}.chip.cue.v{background:var(--gold-bg)}
.chip b{color:var(--head)}
.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px}
.no{font:700 20px "Outfit",sans-serif;color:#fff;background:var(--head);border-radius:50%;min-width:34px;height:34px;line-height:34px;text-align:center}
.no.b{background:var(--mute)}
.title{font-size:21px;font-weight:700;color:var(--head);line-height:1.3}
.slot{margin-left:auto;text-align:right}
.slot .t{font:700 26px "Outfit",sans-serif;color:var(--head)}
.slot .t.warn{color:var(--warn)}.slot .t.over{color:var(--over)}
.slot small{display:block;font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--soft);margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s linear}
.bar i.warn{background:var(--gold)}.bar i.over{background:var(--over)}
.say{font-size:23px;line-height:1.7;margin:0;overflow:auto}
.say b{color:var(--head)}
.say u{text-decoration:none;border-bottom:2px solid var(--teal)}
details{margin:0 18px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;line-height:1.55}
summary{cursor:pointer;font-weight:600;color:var(--head)}
details ul{margin:6px 0 4px;padding-left:20px}
.log{margin:0 18px 22px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.log h2{font-size:16px;margin:0 0 8px;color:var(--head)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--soft)}
td.n,th.n{text-align:right;font-family:"Outfit","Plex Thai",sans-serif;font-variant-numeric:tabular-nums}
tr.cur td{background:var(--teal-bg)}
td.over{color:var(--over);font-weight:600}td.under{color:var(--teal)}
.keys{font-size:13px;color:var(--mute);margin:8px 0 0}
kbd{font:600 12px "Outfit",sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff;color:var(--ink)}
@media (max-width:900px){main{grid-template-columns:1fr}.say{font-size:19px}.btns{margin-left:0}}
</style></head><body>

<script>
const D=JSON.parse(document.getElementById('data').textContent), SEC=D.secs, frame=document.getElementById('deck');
const $=id=>document.getElementById(id), fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const sgn=s=>(s>0?'+':s<0?'-':'')+fmt(Math.abs(s));
let cur=0, running=false, t0=0, base=0, enter=0;          // base: seconds banked before the last start
const spent=SEC.map(()=>0);
const now=()=>base+(running?(performance.now()-t0)/1000:0);
$('plan').textContent=fmt(D.total);
if($('rules'))$('rules').innerHTML=D.rules.map(r=>'<li>'+r.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</li>').join('');
$('rows').innerHTML=SEC.map((s,k)=>`<tr id="r${k}"><td>${s.main?s.slide:s.key} · ${s.title}</td><td class="n">${fmt(s.sec)}</td><td class="n" id="a${k}">–</td><td class="n" id="d${k}"></td></tr>`).join('');
$('fPlan').textContent=fmt(D.total);
function bank(){const t=now();spent[cur]+=t-enter;enter=t;}
function show(k){
  if(k===cur&&$('title').textContent)return;
  bank();cur=k;const s=SEC[k],nx=SEC[k+1];
  $('no').textContent=s.main?s.slide:s.key;$('no').className='no'+(s.main?'':' b');
  $('title').textContent=s.title;$('slotP').textContent=fmt(s.sec);$('say').innerHTML=s.html;$('say').scrollTop=0;
  $('when').textContent=s.main?'ควรเริ่มที่ '+fmt(s.start):'ไม่นับใน 5 นาที';
  $('cue').textContent=s.cue;$('cue').className='chip cue'+(/วิดีโอ/.test(s.cue)?' v':'');
  $('next').innerHTML=nx?'<b>ถัดไป</b> '+(nx.main?nx.slide:nx.key)+' · '+nx.title:'<b>สไลด์สุดท้าย</b>';
  if(running&&s.main){const d=now()-s.start;const p=$('pace');p.className='pace '+(d>3?'behind':d<-3?'ahead':'');p.textContent=Math.abs(d)<=3?'ตรงเวลา':(d>0?'ช้ากว่าแผน ':'เร็วกว่าแผน ')+fmt(Math.abs(d));}
  document.querySelectorAll('tbody tr').forEach((r,j)=>r.classList.toggle('cur',j===k));
}
function tick(){
  const t=now(),s=SEC[cur],inSlide=spent[cur]+(t-enter);
  $('total').textContent=fmt(t);$('slotT').textContent=fmt(inSlide);
  const r=inSlide/s.sec,c=r>1?'over':r>0.85?'warn':'';
  $('slotT').className='t num '+c;$('bar').className=c;$('bar').style.width=Math.min(100,r*100)+'%';
  let real=0;SEC.forEach((x,j)=>{const a=spent[j]+(j===cur?t-enter:0);if(a<0.5)return;
    $('a'+j).textContent=fmt(a);const d=a-x.sec,el=$('d'+j);el.textContent=sgn(d);el.className='n '+(d>2?'over':d<-2?'under':'');if(x.main)real+=a;});
  if(real){$('fReal').textContent=fmt(real);const d=real-D.total;$('fDiff').textContent=sgn(d);$('fDiff').className='n '+(d>2?'over':d<-2?'under':'');}
  requestAnimationFrame(tick);
}
function toggle(){if(running){base=now();running=false;$('start').textContent='จับเวลาต่อ';}else{t0=performance.now();running=true;$('start').textContent='หยุดจับเวลา';}}
function reset(){running=false;base=0;enter=0;spent.fill(0);$('start').textContent='เริ่มจับเวลา';$('pace').className='pace';$('pace').textContent='ยังไม่เริ่มจับเวลา';
  SEC.forEach((x,j)=>{$('a'+j).textContent='–';$('d'+j).textContent='';});$('fReal').textContent='';$('fDiff').textContent='';send(0);}
const send=n=>frame.contentWindow.postMessage({deckGo:n},'*');
function key(k){
  if(['ArrowRight','PageDown',' ','Enter'].includes(k))send(Math.min(SEC.length-1,cur+1));
  else if(['ArrowLeft','PageUp','Backspace'].includes(k))send(Math.max(0,cur-1));
  else if(k==='Home')send(0);else if(k==='End')send(SEC.length-1);
  else if(k==='r'||k==='R')send(cur);else if(k==='s'||k==='S')toggle();
}
addEventListener('message',e=>{const d=e.data||{};if(d.deckSlide!=null)show(d.deckSlide);if(d.deckKey)key(d.deckKey);});
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button,summary'))return;if([' ','ArrowRight','ArrowLeft','PageDown','PageUp','Home','End','Backspace'].includes(e.key))e.preventDefault();key(e.key);});
$('start').onclick=e=>{toggle();e.target.blur();};$('reset').onclick=e=>{reset();e.target.blur();};
$('copy').onclick=()=>{const t=now();const lines=SEC.map((x,j)=>{const a=spent[j]+(j===cur?t-enter:0);return `${x.main?x.slide:x.key}\t${x.title}\tแผน ${fmt(x.sec)}\tซ้อม ${a<0.5?'-':fmt(a)}`;});
  const txt='ผลซ้อม '+new Date().toLocaleString('th-TH')+'\n'+lines.join('\n')+'\nรวม '+$('fReal').textContent+' / '+fmt(D.total);
  const done=()=>{$('copied').textContent='คัดลอกแล้ว';setTimeout(()=>$('copied').textContent='',2000);};
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done,()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done();});};
$('title').textContent='';show(0);$('title').textContent=SEC[0].title;tick();
